name: devops-trends CI # Name shown in the Actions tab
on:
  push:
    branches: [main] # Runs on every push to main — webhook built in
  workflow_dispatch: # Adds a manual Run workflow button
jobs:
  build:
    runs-on: ubuntu-latest # Fresh Linux machine for every run
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Downloads repo code onto the runner
      - name: Set up Java 21
        uses: actions/setup-java@v4 # Installs Java on the runner
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: Build
        run: mvn clean compile # Compiles Java source files
      - name: Test
        run: mvn test # Runs JUnit tests